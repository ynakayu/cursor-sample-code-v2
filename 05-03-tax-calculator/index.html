<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消費税計算</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.625rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 1.25rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
    }

    .tax-options {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .tax-options label {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-weight: 400;
      margin-bottom: 0;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result-area {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 4px;
      min-height: 3rem;
    }

    .result-area p {
      margin: 0;
      font-size: 0.875rem;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111;
    }

    .error {
      color: #dc2626;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0;
    }

    legend {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>消費税計算</h1>

    <label for="amount">金額（円）</label>
    <input type="text" id="amount" inputmode="numeric" placeholder="例: 1000">

    <fieldset class="tax-options">
      <legend class="sr-only">税率</legend>
      <label>
        <input type="radio" name="taxRate" value="8" checked>
        8%
      </label>
      <label>
        <input type="radio" name="taxRate" value="10">
        10%
      </label>
    </fieldset>

    <button type="button" id="calculateBtn">計算</button>

    <div class="result-area" id="resultArea">
      <p>税込価格がここに表示されます</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
