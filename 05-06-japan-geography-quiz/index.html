<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本の地理クイズ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      text-align: center;
    }

    .question {
      font-size: 18px;
      margin-bottom: 16px;
    }

    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .correct {
      background-color: lightgreen;
    }

    .wrong {
      background-color: lightcoral;
    }

    #next-btn, #restart-btn {
      margin-top: 16px;
    }

    #result {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>日本の地理クイズ</h1>

  <div id="quiz">
    <div id="progress"></div>
    <p id="question" class="question"></p>
    <div id="choices"></div>
    <p id="feedback"></p>
    <button id="next-btn" style="display:none;">次へ</button>
  </div>

  <div id="result" style="display:none;">
    <h2>結果</h2>
    <p id="score"></p>
    <button id="restart-btn">もう一度</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
